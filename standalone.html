<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --dim:#5b6672; --line:#e3e7ec;
  --accent:#2f6fed; --accent-soft:#e8f0ff;
  --phy:#2f6fed; --phy-soft:#e8f0ff;
  --chem:#e0662a; --chem-soft:#fdeee5;
  --ok:#1a9e5f; --warn:#b8860b; --danger:#d94848;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
}
html[data-theme="dark"]{
  --bg:#12151a; --card:#1a1f26; --ink:#e8edf3; --dim:#9aa7b4; --line:#2a323c;
  --accent:#6f9dff; --accent-soft:#1d2839;
  --phy:#6f9dff; --phy-soft:#1d2839;
  --chem:#ff9a5c; --chem-soft:#33231a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:12px;
  padding:10px 16px; background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand-mark{font-size:19px}
.topbar-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end}
#search{
  width:min(420px,52vw); padding:8px 12px; font:inherit; color:inherit;
  background:var(--bg); border:1px solid var(--line); border-radius:999px; outline:none;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;font-size:16px;cursor:pointer;
  color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:10px;
}
.icon-btn:hover{color:var(--ink)}

/* ---------- tabs ---------- */
.tabs{
  display:flex; gap:6px; padding:12px 16px 0; overflow-x:auto;
  scrollbar-width:none; max-width:1080px; margin:0 auto;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px; border-radius:999px; white-space:nowrap; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:14px;
}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{
  background:var(--tab-soft,var(--accent-soft)); color:var(--tab-ink,var(--accent));
  border-color:transparent; font-weight:600;
}
.tab .n{opacity:.65;font-size:12px;margin-left:5px}

/* ---------- view ---------- */
.view{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
.empty{padding:40px 0;text-align:center;color:var(--dim)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:8px}
.mod{
  display:block;padding:20px;border-radius:var(--radius);background:var(--card);
  border:1px solid var(--line); box-shadow:var(--shadow); transition:transform .15s ease;
}
.mod:hover{transform:translateY(-2px)}
.mod h2{margin:0 0 6px;font-size:19px}
.mod p{margin:0;color:var(--dim);font-size:13.5px}
.mod .badge{display:inline-block;margin-bottom:10px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.mod-phy .badge{background:var(--phy-soft);color:var(--phy)}
.mod-chem .badge{background:var(--chem-soft);color:var(--chem)}

.lesson{margin:22px 0 8px;font-size:15px;font-weight:650;color:var(--dim);
  display:flex;align-items:center;gap:10px}
.lesson::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- experiment card ---------- */
.exp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
.exp>summary{
  list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;
}
.exp>summary::-webkit-details-marker{display:none}
.exp>summary::before{content:"▸";color:var(--dim);transition:transform .15s ease;flex:none}
.exp[open]>summary::before{transform:rotate(90deg)}
.exp .title{font-weight:600}
.exp .tag{margin-left:auto;flex:none;font-size:12px;color:var(--dim);border:1px solid var(--line);
  padding:2px 8px;border-radius:999px}
.exp .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.exp.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.exp.done .title::after{content:" ✓";color:var(--ok);font-weight:700}

.sec{margin-top:14px}
.sec>h4{margin:0 0 6px;font-size:13px;letter-spacing:.4px;color:var(--dim);text-transform:uppercase}
.purpose{color:var(--ink)}
ul.clean{margin:6px 0 0;padding-left:20px}
ul.clean li{margin:3px 0}
.hint{color:var(--dim);font-size:13px}

table.tbl{border-collapse:collapse;width:100%;margin-top:6px;font-size:14px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.tbl th{background:var(--bg);font-weight:600}

.steps{counter-reset:s;list-style:none;margin:6px 0 0;padding:0}
.steps li{position:relative;padding:6px 0 6px 34px;counter-increment:s}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:700;
  background:var(--accent-soft);color:var(--accent);
}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin:4px 0 0;flex:none;width:15px;height:15px;accent-color:var(--accent)}
.check.on>span{color:var(--dim);text-decoration:line-through}
.mats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding:0;list-style:none}
.mats li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13.5px}
.mats li.on{opacity:.5;text-decoration:line-through}

.callout{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);
  padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px;font-size:14px}
.callout.danger{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.callout.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}

/* ---------- quiz ---------- */
.quiz{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.q{margin:10px 0}
.q .stem{font-weight:600;margin-bottom:6px}
.opt{display:block;margin:5px 0;padding:7px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.opt:hover{background:var(--bg)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent)}
.opt input{margin-right:7px}
.q .why{color:var(--dim);font-size:13.5px;margin-top:5px;display:none}
.q.answered .why{display:block}

.foot{max-width:1080px;margin:0 auto;padding:18px 16px 40px;color:var(--dim);font-size:13px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.sep{opacity:.5}

@media (max-width:640px){
  .brand span:last-child{display:none}
  #search{width:100%}
  .exp .tag{display:none}
}
@media print{
  .topbar,.tabs,.foot,.quiz{display:none}
  .exp{border:none;box-shadow:none;page-break-inside:avoid}
  .exp .body{display:block!important}
}

</style>
</head>

    "conclusion": "聚乙烯等普通塑料化学性质稳定，很难被微生物分解，大量废弃塑料会造成白色污染，破坏土壤结构、污染水体、危害动物。塑料受热熔化、冷却变硬说明它属于热塑性塑料，可以回收再利用，减少白色污染应采取减少使用、重复使用、分类回收和开发可降解塑料等措施。",
    "safety": [
      "加热塑料时要在通风处进行，塑料受热可能放出有害气体，不要吸入。",
      "实验后的塑料碎片和土壤样品要按要求回收，不能随意丢弃。",
      "使用酒精灯时注意防火，要用灯帽盖灭，不能用嘴吹灭。",
      "接触土壤后要洗手，保持个人卫生。"
    ],
    "quiz": [
      {
        "stem": "下列关于白色污染的说法中，正确的是",
        "options": [
          "白色污染是指白色的垃圾",
          "白色污染主要是指废弃塑料制品造成的污染",
          "白色污染只影响美观，没有其他危害",
          "焚烧塑料是处理废弃塑料的最好方法"
        ],
        "answer": 1,
        "why": "白色污染是指废弃塑料制品难以降解而对环境造成的污染，它会破坏土壤、污染水体并危害动物。"
      },
      {
        "stem": "下列做法中，不利于减少白色污染的是",
        "options": [
          "购物时自带布袋或纸袋",
          "重复使用塑料袋",
          "把废弃塑料分类回收",
          "把用过的塑料袋随意丢弃在土壤中"
        ],
        "answer": 3,
        "why": "随意丢弃塑料袋会使塑料进入土壤和水体，加重白色污染，其余做法都能减少塑料废弃物的危害。"
      }
    ]
  }
];

</script>
<script>
/* 初中物理·化学实验库 —— 交互逻辑（无依赖，纯前端） */
(function () {
  'use strict';

  var MODULES = [
    { key: 'physics',   name: '物理实验',  sub: '初中物理全部必做实验与重点探究', emoji: '🧲' },
    { key: 'chemistry', name: '化学实验',  sub: '初中化学基础操作、气体制备与性质探究', emoji: '⚗️' }
  ];

  var STORE_KEY = 'pcl.progress.v1';
  var THEME_KEY = 'pcl.theme';

  var state = {
    route: 'home',
    q: '',
    done: loadDone()
  };

  /* ---------- storage ---------- */
  function loadDone() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveDone() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.done)); } catch (e) {}
  }
  function isDone(id) { return !!state.done[id]; }
  function toggleDone(id) {
    if (state.done[id]) delete state.done[id]; else state.done[id] = 1;
    saveDone();
  }

  /* ---------- data access ---------- */
  function list(key) {
    var raw = key === 'physics' ? window.PHYSICS : window.CHEMISTRY;
    return Array.isArray(raw) ? raw : [];
  }
  function modMeta(key) {
    for (var i = 0; i < MODULES.length; i++) if (MODULES[i].key === key) return MODULES[i];
    return null;
  }
  function totalDone() {
    var n = 0;
    MODULES.forEach(function (m) {
      list(m.key).forEach(function (e) { if (isDone(e.id)) n++; });
    });
    return n;
  }
  function totalCount() {
    return MODULES.reduce(function (n, m) { return n + list(m.key).length; }, 0);
  }

  /* ---------- tiny DOM helpers (text-safe) ---------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== '') n.textContent = text;
    return n;
  }
  function frag() { return document.createDocumentFragment(); }
  function appendAll(parent, kids) {
    (kids || []).forEach(function (k) { if (k) parent.appendChild(k); });
    return parent;
  }

  /* ---------- text search ---------- */
  function matches(exp, q) {
    if (!q) return true;
    var hay = [
      exp.title, exp.grade, exp.lesson, exp.purpose, exp.conclusion, exp.observe,
      (exp.materials || []).join(' '),
      (exp.steps || []).join(' '),
      (exp.safety || []).join(' ')
    ].join(' ').toLowerCase();
    var needles = q.toLowerCase().split(/\s+/).filter(Boolean);
    for (var i = 0; i < needles.length; i++) {
      if (hay.indexOf(needles[i]) === -1) return false;
    }
    return true;
  }

  /* ---------- render: home ---------- */
  function renderHome() {
    var view = el('div');
    var intro = el('p', 'hint', '两个模块各自独立。点进任意实验可展开器材清单、操作步骤、现象与结论，' +
      '并带随堂小测；勾选和自测进度会保存在本机浏览器里。');
    view.appendChild(intro);

    var grid = el('div', 'mods');
    appendAll(grid, MODULES.map(function (m) {
      var a = el('a', 'mod ' + (m.key === 'physics' ? 'mod-phy' : 'mod-chem'));
      a.href = '#/' + m.key;
      a.appendChild(el('span', 'badge', m.emoji + ' ' + m.name));
      a.appendChild(el('h2', null, m.name));
      a.appendChild(el('p', null, m.sub));
      var items = list(m.key);
      var done = items.filter(function (e) { return isDone(e.id); }).length;
      a.appendChild(el('p', 'hint', '共 ' + items.length + ' 个实验' +
        (done ? ' · 已完成 ' + done + ' 个' : '')));
      return a;
    }));
    view.appendChild(grid);
    return view;
  }

  /* ---------- render: experiment card ---------- */
  function card(exp, modKey) {
    var d = el('details', 'exp' + (isDone(exp.id) ? ' done' : ''));
    d.id = 'exp-' + exp.id;

    var sum = el('summary');
    var cb = el('input');
    cb.type = 'checkbox';
    cb.checked = isDone(exp.id);
    cb.title = '标记为已掌握';
    cb.style.accentColor = 'var(--ok)';
    cb.addEventListener('click', function (ev) {
      ev.stopPropagation();
      toggleDone(exp.id);
      d.classList.toggle('done', isDone(exp.id));
      updateStats();
    });
    sum.appendChild(cb);
    sum.appendChild(el('span', 'title', exp.title));
    sum.appendChild(el('span', 'tag', [exp.grade, exp.lesson].filter(Boolean).join(' · ')));
    d.appendChild(sum);

    var body = el('div', 'body');

    if (exp.purpose) {
      body.appendChild(section('实验目的', [el('p', 'purpose', exp.purpose)]));
    }

    if (exp.materials && exp.materials.length) {
      var ul = el('ul', 'mats');
      exp.materials.forEach(function (m) {
        var li = el('li', null, m);
        li.style.cursor = 'pointer';
        li.title = '点击划掉 / 恢复';
        li.addEventListener('click', function () { li.classList.toggle('on'); });
        ul.appendChild(li);
      });
      body.appendChild(section('实验器材', [ul, el('p', 'hint', '（点器材可划掉，方便清点）')]));
    }

    if (exp.steps && exp.steps.length) {
      var ol = el('ol', 'steps');
      exp.steps.forEach(function (s) {
        var li = el('li');
        var lab = el('label', 'check');
        var c = el('input');
        c.type = 'checkbox';
        c.addEventListener('change', function () { lab.classList.toggle('on', c.checked); });
        lab.appendChild(c);
        lab.appendChild(el('span', null, s));
        li.appendChild(lab);
        ol.appendChild(li);
      });
      body.appendChild(section('操作步骤', [ol]));
    }

    if (exp.data && exp.data.headers && exp.data.rows) {
      var t = el('table', 'tbl');
      var thead = el('thead'), tr = el('tr');
      exp.data.headers.forEach(function (h) { tr.appendChild(el('th', null, h)); });
      thead.appendChild(tr); t.appendChild(thead);
      var tb = el('tbody');
      exp.data.rows.forEach(function (row) {
        var r = el('tr');
        row.forEach(function (c) { r.appendChild(el('td', null, c)); });
        tb.appendChild(r);
      });
      t.appendChild(tb);
      body.appendChild(section(exp.data.caption || '数据记录', [t]));
    }

    if (exp.observe) {
      body.appendChild(section('实验现象', [el('p', null, exp.observe)]));
    }
    if (exp.conclusion) {
      var p = el('p', null, exp.conclusion);
      var box = el('div', 'callout ok');
      box.appendChild(p);
      body.appendChild(section('结论', [box]));
    }
    if (exp.safety && exp.safety.length) {
      var box2 = el('div', 'callout danger');
      var ul2 = el('ul', 'clean');
      exp.safety.forEach(function (s) { ul2.appendChild(el('li', null, s)); });
      box2.appendChild(ul2);
      body.appendChild(section('安全提示', [box2]));
    }
    if (exp.quiz && exp.quiz.length) {
      body.appendChild(quizBlock(exp));
    }

    d.appendChild(body);
    return d;
  }

  function section(title, kids) {
    var s = el('section', 'sec');
    s.appendChild(el('h4', null, title));
    appendAll(s, kids);
    return s;
  }

  /* ---------- quiz ---------- */
  function quizBlock(exp) {
    var wrap = el('div', 'quiz');
    wrap.appendChild(el('h4', null, '随堂小测'));

    exp.quiz.forEach(function (q, qi) {
      var qd = el('div', 'q');
      qd.appendChild(el('div', 'stem', (qi + 1) + '. ' + (q.stem || q.q || '')));
      var opts = q.options || q.opts || [];
      var answered = false;
      opts.forEach(function (text, oi) {
        var lab = el('label', 'opt');
        var r = el('input');
        r.type = 'radio';
        r.name = 'q-' + exp.id + '-' + qi;
        lab.appendChild(r);
        lab.appendChild(document.createTextNode(text));
        r.addEventListener('change', function () {
          if (answered) { r.checked = false; return; }
          answered = true;
          qd.classList.add('answered');
          var right = (q.answer != null ? q.answer : q.a);
          lab.classList.add(oi === right ? 'right' : 'wrong');
          if (oi !== right) {
            var correct = qd.querySelectorAll('.opt')[right];
            if (correct) correct.classList.add('right');
          }
        });
        qd.appendChild(lab);
      });
      if (q.why || q.explain) qd.appendChild(el('div', 'why', '解析：' + (q.why || q.explain)));
      wrap.appendChild(qd);
    });
    return wrap;
  }

  /* ---------- render: module ---------- */
  function renderModule(key) {
    var meta = modMeta(key);
    var items = list(key);
    var view = el('div');

    if (!items.length) {
      view.appendChild(el('div', 'empty', '这个模块的数据还没加载出来。'));
      return view;
    }

    var filtered = items.filter(function (e) { return matches(e, state.q); });
    var head = el('p', 'hint',
      meta.name + '共 ' + items.length + ' 个实验' +
      (state.q ? '，匹配「' + state.q + '」的 ' + filtered.length + ' 个' : '') +
      '。展开＝看内容，左侧方框＝标记已掌握。');
    view.appendChild(head);

    if (!filtered.length) {
      view.appendChild(el('div', 'empty', '没有匹配的实验，换个关键词试试。'));
      return view;
    }

    // group by 年级 then 课题, preserving source order
    var groups = [];
    var index = {};
    filtered.forEach(function (e) {
      var g = (e.grade || '') + '|' + (e.lesson || '');
      if (!(g in index)) { index[g] = groups.length; groups.push({ label: [e.grade, e.lesson].filter(Boolean).join(' · ') || '其他', items: [] }); }
      groups[index[g]].items.push(e);
    });

    groups.forEach(function (g) {
      view.appendChild(el('div', 'lesson', g.label));
      g.items.forEach(function (e) { view.appendChild(card(e, key)); });
    });
    return view;
  }

  /* ---------- stats / chrome ---------- */
  function updateStats() {
    var t = totalCount(), d = totalDone();
    document.getElementById('stats').textContent =
      t ? ('共 ' + t + ' 个实验，已掌握 ' + d + ' 个' + (t ? '（' + Math.round(d / t * 100) + '%）' : ''))
        : '数据加载中…';
  }

  function renderTabs() {
    var tabs = document.getElementById('tabs');
    tabs.textContent = '';
    var home = el('a', 'tab', '首页');
    home.href = '#/';
    if (state.route === 'home') home.setAttribute('aria-current', 'true');
    tabs.appendChild(home);

    MODULES.forEach(function (m) {
      var a = el('a', 'tab');
      a.href = '#/' + m.key;
      a.textContent = m.name;
      var n = el('span', 'n', String(list(m.key).length));
      a.appendChild(n);
      if (state.route === m.key) {
        a.setAttribute('aria-current', 'true');
        a.style.setProperty('--tab-ink', m.key === 'physics' ? 'var(--phy)' : 'var(--chem)');
        a.style.setProperty('--tab-soft', m.key === 'physics' ? 'var(--phy-soft)' : 'var(--chem-soft)');
      }
      tabs.appendChild(a);
    });
  }

  function paint() {
    renderTabs();
    var view = document.getElementById('view');
    view.textContent = '';
    view.appendChild(state.route === 'home' ? renderHome() : renderModule(state.route));
    updateStats();
  }

  /* ---------- routing ---------- */
  function parseHash() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    if (!h) return 'home';
    return modMeta(h) ? h : 'home';
  }
  function onHash() {
    var next = parseHash();
    if (next !== state.route) { state.route = next; paint(); }
  }

  /* ---------- init ---------- */
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!saved) {
      saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', saved);
  }
  function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  function boot() {
    initTheme();
    state.route = parseHash();
    paint();

    window.addEventListener('hashchange', onHash);

    var s = document.getElementById('search');
    var timer = null;
    s.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        state.q = s.value.trim();
        if (state.route === 'home' && state.q) {
          // searching from home jumps to the first module that has matches
          for (var i = 0; i < MODULES.length; i++) {
            if (list(MODULES[i].key).some(function (e) { return matches(e, state.q); })) {
              location.hash = '#/' + MODULES[i].key;
              return;
            }
          }
        }
        paint();
      }, 140);
    });
    // "/" focuses the search box
    document.addEventListener('keydown', function (ev) {
      if (ev.key === '/' && document.activeElement !== s) { ev.preventDefault(); s.focus(); }
      if (ev.key === 'Escape' && document.activeElement === s) { s.value = ''; state.q = ''; s.blur(); paint(); }
    });

    document.getElementById('theme').addEventListener('click', toggleTheme);
    document.getElementById('reset').addEventListener('click', function () {
      if (!confirm('清空所有"已掌握"标记？')) return;
      state.done = {}; saveDone(); paint();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
